<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Architect Order</title>
<!-- user-scalable is deliberately left alone: people will want to pinch-zoom a
     carving on a wall, and every input is 16px so iOS never auto-zooms. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Palette carried over from london-noticing. Portland stone for the ground,
     cast iron for the ink, the oxide red of Roman tile courses for the accent.

     Three theme states, not two. An explicit choice stamps data-theme on the
     root; the default setting stamps nothing and only prefers-color-scheme
     separates light from dark. So the bare :root carries the whole light
     palette, the media query redefines tokens for the unstamped dark case, and
     the [data-theme] blocks let a deliberate choice win in either direction.
     Every component reads tokens, never a literal, or it renders one theme's
     text on the other theme's ground. */
  :root {
    --paper: #ECEBE7; --panel: #FAFAF8; --ink: #191B1C; --ink-soft: #5C6163;
    --line: #CFCFC8; --accent: #9E2B25; --accent-soft: #F0DEDB;
    --accent-ink: #FFFFFF;
    --good: #2F6B4F; --good-soft: #DCE9E2;
    --warn: #9E2B25; --warn-soft: #F0DEDB;
    --key: #E0E0DA; --key-ink: #191B1C; --shadow: 0 1px 3px rgba(25,27,28,.13);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #141617; --panel: #1D2022; --ink: #E8E7E3; --ink-soft: #9AA0A2;
      --line: #363B3D; --accent: #E08078; --accent-soft: #3A2220;
      --accent-ink: #141617;
      --good: #6FBF97; --good-soft: #1E3229;
      --warn: #E08078; --warn-soft: #3A2220;
      --key: #2A2E30; --key-ink: #E8E7E3; --shadow: 0 1px 3px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    --paper: #141617; --panel: #1D2022; --ink: #E8E7E3; --ink-soft: #9AA0A2;
    --line: #363B3D; --accent: #E08078; --accent-soft: #3A2220;
    --accent-ink: #141617;
    --good: #6FBF97; --good-soft: #1E3229;
    --warn: #E08078; --warn-soft: #3A2220;
    --key: #2A2E30; --key-ink: #E8E7E3; --shadow: 0 1px 3px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; align-items: center; }
  .screen { width: 100%; max-width: 560px; display: none; flex-direction: column;
            min-height: 100dvh; padding: 8px 12px calc(20px + env(safe-area-inset-bottom)); }
  .screen.on { display: flex; }
  header { display: flex; align-items: center; gap: 10px; padding: 6px 2px; }
  .wordmark { font-family: Georgia, "Times New Roman", serif; font-weight: 700;
              font-size: 1.15rem; letter-spacing: .08em; line-height: 1.2; }
  .wordmark span { color: var(--accent); }
  .tagline { font-size: .68rem; color: var(--ink-soft); letter-spacing: .08em;
             text-transform: uppercase; }
  .menubtn { margin-left: auto; border: 1px solid var(--line); background: var(--panel);
             color: var(--ink-soft); border-radius: 999px; width: 44px; height: 44px;
             font-size: 1.1rem; cursor: pointer; flex: none; }
  .banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px;
            font-size: .74rem; padding: 7px 10px; margin: 6px 0; line-height: 1.4; }
  .banner.sim { background: var(--accent-soft); color: var(--ink); }

  .intro { font-family: Georgia, serif; font-size: 1rem; line-height: 1.55;
           padding: 10px 2px 4px; }
  .spacer { flex: 1; }

  .btn { border: none; border-radius: 10px; padding: 14px 0; font-size: .98rem;
         font-weight: 600; cursor: pointer; width: 100%; min-height: 46px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: var(--key); color: var(--key-ink); }

  /* The progress bar rides at the top while the walk scrolls under it. */
  #topbar { position: sticky; top: 0; z-index: 6; background: var(--paper);
            padding: 6px 2px 8px; border-bottom: 1px solid var(--line);
            display: flex; flex-direction: column; gap: 5px; }
  .meter { display: flex; align-items: center; gap: 9px; }
  .mlabel { font-size: .72rem; color: var(--ink-soft); white-space: nowrap;
            flex: 0 0 74px; }
  .mbar { flex: 1; height: 8px; border-radius: 999px; background: var(--key);
          overflow: hidden; }
  .mfill { height: 100%; width: 0; border-radius: 999px; transition: width .4s ease; }
  .mfill.good { background: var(--good); }
  .mfill.bad  { background: var(--warn); }
  .mnum { font-size: .78rem; color: var(--ink-soft); font-variant-numeric: tabular-nums;
          min-width: 3.6em; text-align: right; }
  /* Start over, always on screen while the hunt has skips on: it rides in the
     sticky bar with the progress so a tester never has to find the menu. It
     follows the same flag as the Skip buttons and goes with them. */
  .tool.restart { padding: 7px 12px; min-height: 34px; font-size: .72rem; flex: none;
                  margin-left: 4px; }

  #walk { flex: 1; padding-top: 8px; }
  .stop { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
          padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .shead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
           font-size: .72rem; font-weight: 700; letter-spacing: .06em;
           text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px; }
  .shead .no { color: var(--accent); }
  .stitle { font-family: Georgia, serif; font-size: 1.15rem; line-height: 1.3;
            margin-bottom: 12px; }
  /* Anything hidden must actually be hidden, whatever display a rule above set. */
  [hidden] { display: none !important; }
  .stext { font-family: Georgia, serif; font-size: 1rem; line-height: 1.55;
           white-space: pre-line; }
  .stext + .stext { margin-top: 12px; }
  /* Words, not characters. The whole text is laid out invisibly from the first
     frame, so the card never grows and lines never re-wrap mid-reveal, and each
     word then darkens into place. It reads like a voice rather than a machine. */
  .stext .w { opacity: 0; }
  .stext .w.on { opacity: 1; transition: opacity .45s ease; }
  @media (prefers-reduced-motion: reduce) {
    .stext .w { opacity: 1; }
    .letters.live .tile { opacity: 1; }
    .finale .fl { opacity: 1; }
  }
  /* A picture is the picture and nothing else: no border, no ground, no
     shadow, no rounded corners. A drawing on torn paper with a transparent
     edge has to float on the card, and any box around it is a frame. */
  figure { margin: 12px 0; }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { font-size: .78rem; color: var(--ink-soft); line-height: 1.45;
               margin-top: 6px; }
  .payrule { border-top: 1px solid var(--line); margin: 16px 0 14px; }
  .srow { margin-top: 14px; }

  /* A finished stop stays on the page as it was read: its words, its pictures,
     the answer that was typed and the letters it left behind, all there to
     scroll back to. What goes is everything that was a control: the check,
     the camera, the question's box and the buttons. A coloured edge and a
     word in the header say how it went. */
  .stop.done { border-left: 3px solid var(--good); }
  .stop.done.miss { border-left-color: var(--warn); }
  .shead .pr { margin-left: auto; font-weight: 500; letter-spacing: 0;
               text-transform: none; font-size: .74rem; }

  /* The letters a stop leaves behind: tiles, in whatever order the content
     says. They arrive one after another the first time and sit still after. */
  .letters { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
             margin-top: 14px; }
  .letters .tile { font-family: Georgia, serif; font-weight: 700; font-size: 1.25rem;
                   width: 2.2rem; height: 2.5rem; display: flex; align-items: center;
                   justify-content: center; border: 1px solid var(--line);
                   border-radius: 6px; background: var(--paper); color: var(--accent); }
  .letters.live .tile { opacity: 0; animation: tilein .5s ease forwards; }
  @keyframes tilein { to { opacity: 1; } }
  /* The ending's one line of letters. Each letter is a span placed in a slot
     one n-th of the width wide, so that it can slide to a different slot. */
  .finale { position: relative; height: 2.4em; margin: 6px 0 16px;
            font-family: Georgia, serif; font-weight: 700;
            font-size: min(1.3rem, 4.6vw); color: var(--accent); }
  .finale .fl { position: absolute; top: 0; width: calc(100% / var(--n, 15));
                text-align: center; line-height: 2.4em; opacity: 0;
                transition: left 1.6s cubic-bezier(.25,.8,.25,1), opacity .6s ease; }
  .finale .fl.on { opacity: 1; }
  .finale .fl.moving { opacity: .3; }

  /* The gate: a question of presence, before anything is said. */
  .gatewrap { text-align: center; padding: 4px 2px 2px; margin-top: 14px; }
  .gatestat { font-size: .8rem; color: var(--ink-soft); min-height: 1.2em;
              margin: 10px 0 2px; font-variant-numeric: tabular-nums; }
  .gatedone { margin-top: 14px; font-size: .82rem; color: var(--good);
              font-weight: 600; text-align: center; }
  .gatedone .btn { margin-top: 10px; }
  .camrow { margin-top: 14px; }
  /* The tick. iOS Safari has no vibration API, and it ticks a native switch
     control only when a finger lands on the switch itself: toggled from
     script, by its label or by its own click(), it stays silent. So every
     button carries an invisible switch stretched over its whole face. The
     finger lands on the switch, the phone ticks, and the tap bubbles up to the
     button and does what the button does. Scaled with a transform because a
     native control ignores width and height; clipped so it never spills. */
  button { position: relative; }
  .tickpad { position: absolute; inset: 0; overflow: hidden; display: block;
             border-radius: inherit; }
  .tickpad input { position: absolute; left: 50%; top: 50%; width: 51px; height: 31px;
                   margin: -15.5px 0 0 -25.5px; opacity: 0; transform-origin: 50% 50%;
                   transform: scale(var(--sx, 1), var(--sy, 1)); }
  button:disabled .tickpad { pointer-events: none; }
  .tickinfo { margin-top: 10px; font-size: .78rem; line-height: 1.45; color: var(--ink-soft);
              white-space: pre-line; border-left: 3px solid var(--line); padding-left: 10px; }
  .logbox { width: 100%; min-height: 8em; margin-top: 10px; font-family: ui-monospace,
            SFMono-Regular, Menlo, monospace; font-size: .7rem; padding: 8px;
            border-radius: 8px; border: 1px solid var(--line); background: var(--paper);
            color: var(--ink); white-space: pre; overflow: auto; }
  /* One of eight letters and nothing else. No distance, no "close", because a
     number that shrinks as you walk is a map, and this game is not a map. */
  .compass { margin-top: 12px; display: flex; align-items: baseline;
             justify-content: center; gap: 10px; }
  .compass .pt { font-family: Georgia, serif; font-size: 2.1rem; font-weight: 700;
                 letter-spacing: .04em; color: var(--accent); }
  .compass .cl { font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
                 color: var(--ink-soft); }
  /* The live distance. Informational, rounded, and gone once the gate passes. */
  .distance { margin-top: 8px; font-size: .9rem; color: var(--ink-soft);
              font-variant-numeric: tabular-nums; }
  /* Skip. Plain on purpose: it exists only while the hunt says so, and it
     should never look like the thing you are meant to press. */
  .skipbtn { display: block; margin: 10px auto 0; border: none; background: none;
             color: var(--ink-soft); font: inherit; font-size: .78rem; cursor: pointer;
             text-decoration: underline dotted; text-underline-offset: 3px;
             padding: 8px 12px; min-height: 40px; }

  /* The question. */
  .qask { margin-top: 16px; font-family: Georgia, serif; font-size: 1rem;
          line-height: 1.5; background: var(--accent-soft); color: var(--ink);
          border-radius: 10px; padding: 12px; }
  .qrow { margin-top: 10px; display: flex; gap: 8px; }
  /* min-width: 0 or the Check button walks off the right of the screen. A flex
     item will not shrink below the intrinsic width of its content, and a text
     input's intrinsic width is about twenty characters whatever you set. On a
     360 px phone the button ended four pixels past the edge; on a 320 px one,
     forty-four. */
  .qrow input { flex: 1; min-width: 0; padding: 12px; font-size: 1rem;
                border-radius: 9px; border: 1.5px solid var(--line);
                background: var(--paper); color: var(--ink); min-height: 46px; }
  .qrow input:focus-visible { outline: 2px solid var(--accent); }
  .qrow .btn { width: 96px; flex: none; padding: 11px 0; }
  .qmeter { margin-top: 10px; }
  .qverdict { margin-top: 12px; font-family: Georgia, serif; font-size: 1rem; }
  .qverdict.yes { color: var(--good); }
  .qverdict.no { color: var(--warn); }
  /* The answer that was typed, kept on the card once its box has gone. */
  .qsaid { margin-top: 10px; padding: 12px; font-size: 1rem; border-radius: 9px;
           border: 1.5px solid var(--line); color: var(--ink); min-height: 46px; }
  .stop.wrong { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }

  .lensbtn { border: 1px solid var(--accent); background: var(--accent-soft);
             color: var(--ink); font-size: .82rem; font-weight: 600;
             padding: 11px 18px; border-radius: 999px; cursor: pointer;
             min-height: 44px; }
  .lensrow { margin-top: 14px; display: flex; justify-content: center; }

  .toolrow { display: flex; gap: 6px; justify-content: center; padding: 12px 0 2px;
             flex-wrap: wrap; }
  .tool { border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
          font-size: .76rem; padding: 11px 16px; border-radius: 999px; cursor: pointer;
          min-height: 44px; }
  .tool:focus-visible, .btn:focus-visible, .lensbtn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px; }
  #modal { position: fixed; inset: 0; background: rgba(14,12,10,.55); display: none;
           align-items: center; justify-content: center; padding: 18px; z-index: 20; }
  #modal.show { display: flex; }
  .card { background: var(--panel); color: var(--ink); border-radius: 16px;
          padding: 22px 20px; max-width: 400px; width: 100%;
          box-shadow: 0 12px 40px rgba(0,0,0,.35); max-height: 86dvh; overflow-y: auto; }
  .card h2 { font-family: Georgia, serif; font-size: 1.3rem; margin-bottom: 8px; }
  .card .sub { color: var(--ink-soft); font-size: .84rem; margin-bottom: 10px; line-height: 1.5; }
  .btnrow { display: flex; gap: 8px; margin-top: 14px; }
  .btnrow .btn { flex: 1; padding: 12px 0; font-size: .9rem; }
  /* The approach simulator. Deliberately styled as scaffolding rather than as
     part of the walk, so nobody mistakes it for a feature. */
  .devrow { margin-top: 14px; padding: 10px; border: 1px dashed var(--line);
            border-radius: 10px; display: flex; flex-wrap: wrap; gap: 6px;
            align-items: center; }
  .devrow .devlabel { font-size: .64rem; letter-spacing: .1em; text-transform: uppercase;
                      color: var(--ink-soft); width: 100%; }
  .devrow button { border: 1px solid var(--line); background: var(--paper); color: var(--ink);
                   font: inherit; font-size: .78rem; padding: 9px 12px; border-radius: 999px;
                   cursor: pointer; min-height: 40px; }
  .devrow button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .devrow .devdist { font-size: .74rem; color: var(--ink-soft); margin-left: auto;
                     font-variant-numeric: tabular-nums; }
  .devnote { width: 100%; font-size: .68rem; color: var(--ink-soft); line-height: 1.45; }

  .tally { font-family: Georgia, serif; font-size: 1rem; line-height: 1.6;
           margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .tally ul { margin: 8px 0 0 18px; font-size: .92rem; color: var(--ink-soft); }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
           background: var(--ink); color: var(--paper); font-size: .82rem; padding: 10px 16px;
           border-radius: 14px; opacity: 0; transition: opacity .25s; pointer-events: none;
           z-index: 30; width: calc(100% - 32px); max-width: 420px; text-align: center;
           line-height: 1.35; }
  #toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<!-- No count of stops anywhere: not under the title, not beside the bar. The
     bar is the only indication of how far there is to go. -->
<div class="screen on" id="s-intro">
  <header>
    <div>
      <div class="wordmark">THE ARCHITECT <span>ORDER</span></div>
    </div>
  </header>
  <div class="intro" id="introbody"></div>
  <div class="spacer"></div>
  <button class="btn primary" id="startbtn" data-strong>Begin</button>
</div>

<div class="screen" id="s-walk">
  <header>
    <div>
      <div class="wordmark">THE ARCHITECT <span>ORDER</span></div>
    </div>
    <button class="menubtn" id="menubtn" aria-label="Menu">⋯</button>
  </header>
  <div id="simbanner" class="banner sim" hidden></div>
  <div id="topbar">
    <div class="meter">
      <span class="mlabel">Progress</span>
      <div class="mbar"><div id="progressfill" class="mfill good"></div></div>
      <button class="tool restart" id="restartbtn" hidden>Start over</button>
    </div>
  </div>
  <div id="walk"></div>
</div>

<div id="modal"><div class="card" id="modalcard"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<!-- HUNT GOES HERE -->
<script src="lens.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const HUNT = window.HUNT || null;

// Testing scaffolding is off unless it is asked for by hand. On a real walk
// there is no button to press, and there is no way to reach one, because a
// visible control that opens a gated stop is a skip button whatever it is
// called. Add ?testing=1 or #testing to the address to bring it back.
// Deliberately NOT enabled by hostname. An earlier version switched itself on
// for localhost, which meant the local build quietly had scaffolding the real
// one did not, and the test that was supposed to prove a gate cannot be walked
// past was running against a page that still had the walk-closer buttons on it.
// Implicit is how you end up testing the wrong build. Ask for it every time.
const TESTING = /(?:^|[?&])testing=1(?:&|$)/.test(location.search)
             || location.hash === "#testing";

const FIX_WINDOW_MS = 7000;    // how long to keep listening for a better fix
const FIX_GOOD_ENOUGH_M = 20;  // and when to stop waiting for one
// 800 rather than london-noticing's 500, because the compass drops out and a
// stop's name resolves at 500, and an approach that starts on the line shows
// neither happening.
const SIM_START_M = 800;       // where a simulated approach begins
const SIM_STEP_M = 120;        // and how far one press of the button walks
const SIM_JUMP_M = 10;         // and where "jump inside" lands
// Beyond this, a direction; inside it, nothing at all. A bearing that keeps
// updating as you close in would be a homing beacon, and the diary is supposed
// to be the thing that gets you the last five hundred metres.
const COMPASS_MIN_M = 500;

// Namespaced by hunt, so two hunts served from the same Pages site do not read
// each other's saved position. A phone that has walked the fixture and then
// opens a real hunt starts the real one from the beginning.
const NS = "architect." + (HUNT ? HUNT.id : "none") + ".";
const LS = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(NS + k)) ?? d; }
                   catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch {} },
  del: (k) => { try { localStorage.removeItem(NS + k); } catch {} },
};

let STATE = null;              // { current, gate:{}, result:{}, used:{}, seen:[] }
let SIM = null;                // { lat, lon, acc, dist } while testing
let compassWatch = null;       // a live watchPosition, only while a gate is open
const typing = new Map();

function toast(msg) {
  $("toast").textContent = msg;
  $("toast").classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => $("toast").classList.remove("show"), 3400);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function closeModal() { $("modal").classList.remove("show"); }

/* ---- the word-by-word reveal, kept from london-noticing ---- */
const TYPE_SLOWDOWN = 2.6;
const SENTENCE_PAUSE_MS = 700;
function typeInto(el, text, key, delay, onDone) {
  el.textContent = "";
  const words = [];
  for (const tok of text.split(/(\s+)/)) {
    if (!tok) continue;
    if (/^\s+$/.test(tok)) { el.appendChild(document.createTextNode(tok)); continue; }
    const w = document.createElement("span");
    w.className = "w"; w.textContent = tok;
    el.appendChild(w); words.push(w);
  }
  const step = Math.max(8, Math.min(22, Math.floor(3200 / Math.max(1, text.length))))
               * TYPE_SLOWDOWN;
  const bounds = [];
  let s0 = 0;
  words.forEach((w, k) => {
    if (/[.?!]["')\]]?$/.test(w.textContent) || k === words.length - 1) {
      bounds.push([s0, k]); s0 = k + 1;
    }
  });
  const posIn = (k) => {
    for (const [a, b] of bounds) if (k >= a && k <= b) return b === a ? 0.5 : (k - a) / (b - a);
    return 0.5;
  };
  let k = 0, t = null;
  const finish = () => {
    clearTimeout(t); typing.delete(key);
    for (const w of words) w.classList.remove("w", "on");
    if (onDone) onDone();
  };
  const tick = () => {
    if (k >= words.length) { finish(); return; }
    const w = words[k];
    w.classList.add("on");
    const curve = 1.35 - 0.7 * Math.sin(Math.PI * posIn(k));
    let wait = step * (w.textContent.length + 1) * curve;
    if (/[.?!]["')\]]?$/.test(w.textContent)) wait += SENTENCE_PAUSE_MS;
    k += 1;
    t = setTimeout(tick, wait);
  };
  t = setTimeout(tick, delay || 0);
  typing.set(key, { finish });
  return finish;
}
function seenSet() { return new Set(STATE ? STATE.seen : []); }
function markSeen(key) {
  if (!STATE) return;
  const s = seenSet(); s.add(key);
  STATE.seen = [...s];
  saveState();
}

/* ---- geography. The same haversine and the same pass rule as london-noticing. ---- */
function haversineM(lat1, lon1, lat2, lon2) {
  const R = 6371008.8, r = Math.PI / 180;
  const p1 = lat1 * r, p2 = lat2 * r;
  const a = Math.sin((lat2 - lat1) * r / 2) ** 2
          + Math.cos(p1) * Math.cos(p2) * Math.sin((lon2 - lon1) * r / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
/* Gate tolerance, retuned after walking Saint-Antonin, where a 50 m gate opened
   from more than 50 m away, round a corner, on a different street.

   A phone's reported accuracy is roughly a 68% confidence radius. Subtracting
   all of it means "open if there is any plausible chance you are inside", which
   turned a 50 m gate into a 50 + accuracy gate; under the old 150 m cap a poor
   fix opened a 50 m gate from 200 m. So the allowance is now small and fixed,
   and the reach of any gate is its radius plus 15 m and nothing more.

   Refusing a hopeless fix is the important half. Believing one is how a gate
   opens somewhere the walker has never stood, and that is worse than refusing,
   because refusing is visible and they have a pass button. */
const ACC_ALLOWANCE_M = 15;
const ACC_USELESS_M = 75;

function gatePasses(distanceM, accuracyM, radiusM) {
  const acc = Math.max(0, accuracyM || 0);
  if (acc > ACC_USELESS_M) return false;
  return distanceM - Math.min(acc, ACC_ALLOWANCE_M) <= radiusM;
}
function bearingDeg(lat1, lon1, lat2, lon2) {
  const r = Math.PI / 180;
  const p1 = lat1 * r, p2 = lat2 * r, dl = (lon2 - lon1) * r;
  return (Math.atan2(Math.sin(dl) * Math.cos(p2),
                     Math.cos(p1) * Math.sin(p2)
                     - Math.sin(p1) * Math.cos(p2) * Math.cos(dl)) / r + 360) % 360;
}
function destPoint(lat, lon, bearing, metres) {
  const R = 6371008.8, r = Math.PI / 180;
  const d = metres / R, b = bearing * r, p1 = lat * r, l1 = lon * r;
  const p2 = Math.asin(Math.sin(p1) * Math.cos(d)
                       + Math.cos(p1) * Math.sin(d) * Math.cos(b));
  const l2 = l1 + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(p1),
                             Math.cos(d) - Math.sin(p1) * Math.sin(p2));
  return { lat: p2 / r, lon: ((l2 / r + 540) % 360) - 180 };
}
const POINTS = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
function compassPoint(fromLat, fromLon, toLat, toLon) {
  return POINTS[Math.round(bearingDeg(fromLat, fromLon, toLat, toLon) / 45) % 8];
}

/* ---- answers, checked forgivingly ----
   Nobody is being marked on their spelling, and being told you are wrong when
   you typed "3" instead of "three" would be maddening while standing in a
   square in the rain. Taken from london-noticing unchanged. */
function normalise(text, keepPlural) {
  const out = String(text).toLowerCase()
    // Polish crossed L is its own letter, not l plus a mark, so NFD leaves it
    // alone and the strip below then deletes it. "cegla" survived and "cegla"
    // with the stroke came out as "ceg a". Map it by hand before decomposing.
    .replace(/\u0142/g, "l")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9 ]/g, " ")
    // Filler only. NEVER strip a word that could itself be an answer: "two" and
    // "pair" were in this list to make "a pair of unicorns" match "unicorns",
    // and the result was that typing "two" at a stop whose answer IS two
    // normalised to nothing and was marked wrong. The split-on-words check
    // below already handles an answer buried in a phrase.
    .replace(/\b(a|an|the|is|it|its|they|are|of)\b/g, " ");
  return (keepPlural ? out : out.replace(/s\b/g, ""))
    .replace(/\s+/g, " ").trim();
}
// One typo should not stand between somebody and the rest of the walk. Only for
// answers of five characters or more, where a single edit is almost certainly a
// slip on a phone keyboard rather than a different word: at four characters or
// fewer, "four" and "your" are one edit apart and so are far too many numbers.
function withinOneEdit(a, b) {
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, edits = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++edits > 1) return false;
    if (a.length > b.length) i++;
    else if (a.length < b.length) j++;
    else { i++; j++; }
  }
  return edits + (a.length - i) + (b.length - j) <= 1;
}
// Two letters swapped round is the commonest phone typo of the lot, and it
// costs two edits under the rule above, so it needs its own case. "brickwrok"
// should not be the thing that ends somebody's walk.
function oneSwapApart(a, b) {
  if (a.length !== b.length) return false;
  const at = [];
  for (let k = 0; k < a.length; k++) if (a[k] !== b[k]) at.push(k);
  return at.length === 2 && at[1] === at[0] + 1
      && a[at[0]] === b[at[1]] && a[at[1]] === b[at[0]];
}
function matchesUnder(given, accepted, keepPlural) {
  const g = normalise(given, keepPlural);
  if (!g) return false;
  const words = g.split(" ");
  return accepted.some((a) => {
    const want = normalise(a, keepPlural);
    if (!want) return false;
    if (g === want || words.includes(want)) return true;
    if (want.length < 5) return false;
    return withinOneEdit(g, want) || oneSwapApart(g, want)
        || words.some((w) => withinOneEdit(w, want) || oneSwapApart(w, want));
  });
}
// Tried both with the plural strip and without it. Dropping the last letter of
// "english" leaves "englis", and the strip then turns that into "engli", which
// is two edits from the answer instead of one, so a single slip was rejected.
// Comparing the unstripped forms as well never refuses anything the stripped
// pass would have accepted; the cross-stop rejection checks prove it does not
// tip over into saying yes to everything.
function answerAccepted(given, accepted) {
  return matchesUnder(given, accepted, false)
      || matchesUnder(given, accepted, true);
}

/* ---- state ---- */
function freshState() {
  return { current: 0, gate: {}, cont: {}, matched: {}, result: {}, used: {},
           skipped: {}, revealed: {}, answer: {}, seen: [] };
}
// Which parts of a stop were skipped: {gate, match, question}, each true or absent.
function skippedParts(s) { return STATE.skipped[s.id] || {}; }
function markSkipped(s, part) {
  STATE.skipped[s.id] = { ...skippedParts(s), [part]: true };
}
function skipButton(label, onTap) {
  const b = document.createElement("button");
  b.className = "skipbtn";
  b.textContent = label;
  b.onclick = onTap;
  return b;
}

/* ---- a name that resolves ----
   With reveal.at_m: until the phone is within that of the target on a usable
   fix, the card says what the content says. After that it says where it is,
   and it never goes back: a fix that wobbles out past the line does not
   un-name the place. The pass reveals it too, for a phone that got there
   without a fix ever reading under the line.
   Without at_m: the name comes with the finish, whatever finishes the stop. */
// What finishes a stop: Progress on its match if it has one, else its
// question, else its gate. A skip is not a finish, so it names nothing.
function completesOn(s) {
  if (s.lens && s.lens.kind === "stencil" && s.lens.match) return "match";
  if (s.question) return "question";
  if (s.gate) return "gate";
  return null;
}
function revealsOnFinish(s) { return !!(s.reveal && s.reveal.at_m == null); }
// name is what a one-line mention of the stop says: its title if it has one,
// its chapter otherwise.
function labelOf(s) {
  const r = s.reveal;
  const l = r && STATE.revealed[s.id]
    ? { chapter: r.chapter || s.chapter, title: r.title || s.title || "" }
    : { chapter: s.chapter, title: s.title || "" };
  l.name = l.title || l.chapter;
  return l;
}
// The card is handed in rather than looked up: on a simulated approach the
// first fix is painted while the card is still being built and is not yet in
// the document, and a lookup would find nothing and leave the old name up.
function reveal(s, card) {
  if (!s.reveal || STATE.revealed[s.id]) return;
  STATE.revealed[s.id] = true;
  saveState();
  card = card || document.querySelector(`.stop[data-idx="${HUNT.stops.indexOf(s)}"]`);
  if (!card) return;
  const l = labelOf(s);
  card.querySelector(".shead .chap").textContent = l.chapter;
  const title = card.querySelector(".stitle");
  if (title && l.title) title.textContent = l.title;
}
function saveState() { if (STATE) LS.set("state", STATE); }

/* ---- haptics ----
   One tick, on a tap, when the tap succeeds at something. Android vibrates.
   iPhone has no vibration API, so a native switch control is flipped instead,
   which fires the system's light tick from iOS 17.4. Both only work from
   inside the tap itself: never after an await, a timer or a location
   callback, because on iPhone those fire nothing. So anything that succeeds
   asynchronously does not tick; it lights a button, and the tap on that
   button ticks. */
// The tick that script can make: a vibration where there is a vibration API.
// On iPhone there is none, and the switch tick cannot be made from script at
// all, so there the tick comes from the switch under the finger (armTicks,
// below), and this does nothing the phone can feel. Returns what happened,
// for the test button.
// strong is for the taps that carry the player forward: Begin, Continue,
// Open the camera, Progress, Next, and a right answer. They get two pulses
// where an ordinary tap gets one, twice the weight. On iPhone there is no
// stronger tick to reach: the switch under the finger is one fixed impact.
const TICK_MS = 50;
const TICK_STRONG = [60, 50, 60];
function haptic(strong) {
  const out = { vibrate: "none", strong: !!strong };
  // 50 ms: a pulse under about 30 is beneath what many Android motors can
  // make at all.
  try {
    if (navigator.vibrate) out.vibrate = navigator.vibrate(strong ? TICK_STRONG : TICK_MS) ? "yes" : "refused";
  } catch (err) { out.vibrate = "error"; }
  haptic.count += 1;
  return out;
}
haptic.count = 0;
let lastTick = null;

/* ---- every tap ticks ----
   Each button gets an invisible native switch stretched over its face. On
   iPhone the finger lands on the switch and the phone ticks, which is the one
   way a web page gets a tick there; the tap bubbles to the button and does
   the button's job. Everywhere else the overlay is inert and the tick is the
   vibration, made once per tap here in the capture phase, before the button's
   own handler runs, so it is inside the tap and never after an await. */
const SWITCH_W = 51, SWITCH_H = 31;     // a native switch's own size
const sized = new ResizeObserver((entries) => {
  for (const e of entries) fitTick(e.target);
});
function fitTick(btn) {
  const sw = btn.querySelector(":scope > .tickpad > input");
  if (!sw) return;
  // Exactly the button's face, smaller than a switch where the button is: a
  // switch wider than a round menu button would take taps from beside it.
  const r = btn.getBoundingClientRect();
  sw.style.setProperty("--sx", Math.max(0.2, r.width / SWITCH_W).toFixed(3));
  sw.style.setProperty("--sy", Math.max(0.2, r.height / SWITCH_H).toFixed(3));
}
function armTicks(root) {
  const list = root.matches && root.matches("button") ? [root] : [];
  for (const b of list.concat([...root.querySelectorAll("button")])) {
    if (b.dataset.ticked) continue;
    b.dataset.ticked = "1";
    const pad = document.createElement("span");
    pad.className = "tickpad";
    const sw = document.createElement("input");
    sw.type = "checkbox";
    sw.setAttribute("switch", "");
    sw.tabIndex = -1;
    sw.setAttribute("aria-hidden", "true");
    pad.appendChild(sw);
    b.appendChild(pad);
    fitTick(b);
    sized.observe(b);
  }
}
// Buttons come and go with every render, in the player and in the lens, so
// new ones are armed as they appear rather than by every place that makes one.
new MutationObserver((muts) => {
  for (const m of muts) for (const n of m.addedNodes) if (n.nodeType === 1) armTicks(n);
}).observe(document.documentElement, { childList: true, subtree: true });
document.addEventListener("click", (ev) => {
  const b = ev.target.closest && ev.target.closest("button");
  if (!b || b.disabled) return;
  lastTick = haptic(b.hasAttribute("data-strong"));
}, true);

// What the phone says about itself, and where its tick setting lives. The
// tick either works or it does not, and a phone that says nothing is a phone
// whose settings get guessed at; this puts the guessing on the screen.
function hapticReport(r) {
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const android = /Android/.test(ua);
  const ver = (ua.match(/OS (\d+)[._](\d+)/) || ua.match(/Android (\d+(\.\d+)?)/) || [])[0] || "";
  const inApp = /FBAN|FBAV|Instagram|Line\/|MicroMessenger|GSA\//.test(ua) || (ios && !/Safari/.test(ua));
  const switchOk = "switch" in document.createElement("input");
  const facts = [
    ios ? "iPhone" : android ? "Android" : "not a phone",
    ver, navigator.standalone ? "Home Screen app" : "", inApp ? "in-app browser" : "",
    `vibrate: ${r.vibrate}`, `switch under the finger: ${switchOk ? "yes" : "unsupported"}`,
  ].filter(Boolean).join(" · ");
  let advice;
  if (ios && !switchOk) {
    advice = "This iPhone's browser does not know the switch control, so it cannot tick. iOS 17.4 or later, in Safari or Chrome.";
  } else if (ios) {
    advice = "Your finger landed on a switch, which is the one way this phone ticks. If nothing was felt: Settings → Sounds & Haptics → System Haptics on, and Haptics set to Always Play or Play in Silent Mode. Settings → Accessibility → Touch → Vibration on. An in-app browser or a Home Screen copy may not tick; open the link in Safari itself.";
  } else if (android) {
    advice = r.vibrate === "refused"
      ? "The browser refused to vibrate. Chrome only allows it after a tap on the page, which this was, so it is likely a site setting: tap the lock icon in the address bar → Permissions, or Chrome → Settings → Site settings, and allow vibration if it is listed."
      : "Vibrate was accepted, so if nothing was felt it is the phone: Settings → Sound & vibration → Vibration & haptics on, with touch feedback above zero, and Do Not Disturb off.";
  } else {
    advice = "A computer has no tick. Try it on the phone.";
  }
  return facts + "\n" + advice;
}
window.haptic = haptic;

/* ---- the calibration log ----
   One line per press of Log on a match lens, kept per hunt, copied out of the
   menu as plain text. This is how the thresholds get corrected: the owner
   stands in front of real walls, presses Log at good and bad alignments, and
   pastes the lot back. It survives Start over on purpose, because the walk
   being reset is not the samples being worthless. */
const LOG_HEAD = ["stop", "time", "score", "on", "off", "x", "y", "scale", "rot", "matched",
                  "threshold", "acc_m"];
function logLine(f) {
  const lines = LS.get("log", []);
  lines.push([f.stop, f.time, f.score.toFixed(3), f.on.toFixed(3), f.off.toFixed(3),
              f.x.toFixed(1), f.y.toFixed(1), f.scale.toFixed(3), f.rot.toFixed(1),
              f.matched ? "yes" : "no", (f.threshold == null ? 0 : f.threshold).toFixed(2),
              f.acc == null ? "" : Math.round(f.acc)].join("\t"));
  LS.set("log", lines);
}
function logText() {
  const lines = LS.get("log", []);
  return lines.length ? [LOG_HEAD.join("\t"), ...lines].join("\n") + "\n" : "";
}
// The most recent thing the phone said about where it is, for the log.
let lastFix = null;

/* ---- blocks ---- */
function imageFigure(b) {
  const fig = document.createElement("figure");
  const img = document.createElement("img");
  img.src = b.src;
  img.alt = b.alt || "";
  img.loading = "eager";
  fig.appendChild(img);
  if (b.caption) {
    const cap = document.createElement("figcaption");
    cap.textContent = b.caption;
    fig.appendChild(cap);
  }
  return fig;
}

// A picture is uncovered from the top down, a soft edge travelling over it
// like a sheet drawn back, and the block after it waits for the last of it.
// It registers under its key like a paragraph, so the triple tap finishes it.
const IMAGE_REVEAL_MS = 2600;
const IMAGE_EDGE_PCT = 24;          // how soft the edge is, in percent of height
function revealFigure(fig, key, onDone) {
  const img = fig.querySelector("img");
  let raf = null, t0 = null, finished = false, waiting = null;
  const mask = (edge) => {
    const m = edge >= 100 + IMAGE_EDGE_PCT ? ""
      : `linear-gradient(to bottom, #000 ${Math.max(0, edge - IMAGE_EDGE_PCT)}%, rgba(0,0,0,0) ${edge}%)`;
    fig.style.webkitMaskImage = m;
    fig.style.maskImage = m;
  };
  const finish = () => {
    if (finished) return;
    finished = true;
    if (raf) cancelAnimationFrame(raf);
    clearTimeout(waiting);
    mask(200);
    typing.delete(key);
    if (onDone) onDone();
  };
  const frame = (now) => {
    if (finished) return;
    if (t0 === null) t0 = now;
    const p = Math.min(1, (now - t0) / IMAGE_REVEAL_MS);
    mask((1 - Math.pow(1 - p, 2)) * (100 + IMAGE_EDGE_PCT));
    if (p < 1) raf = requestAnimationFrame(frame); else finish();
  };
  const start = () => { if (!finished && raf === null) raf = requestAnimationFrame(frame); };
  mask(0);                                     // hidden from the first frame
  typing.set(key, { finish });
  // The uncovering only makes sense over a picture that has arrived. They are
  // fetched on the opening screen, so this is nearly always at once; a slow
  // one gets a few seconds and is then shown whole rather than never.
  waiting = setTimeout(start, 4000);
  if (img.complete && img.naturalWidth) start();
  else {
    img.addEventListener("load", start, { once: true });
    img.addEventListener("error", finish, { once: true });
  }
  return finish;
}

// Blocks in order: a picture is uncovered, a text block is written out a word
// at a time and the block after it waits, and a pause block is a held breath
// before the next one. Rushing dumps whatever is left at once, pauses
// included. `shown` is for a card being rebuilt rather than read: everything
// at once, whatever has or has not been seen.
function runBlocks(host, blocks, key, done, shown) {
  const run = { rush: shown || REDUCED || seenSet().has(key), active: null, timer: null, flush: null };
  let idx = 0;
  const step = () => {
    run.timer = null;
    while (idx < blocks.length) {
      const b = blocks[idx];
      const k = key + ":" + idx;
      idx += 1;
      if (b.type === "image") {
        const fig = imageFigure(b);
        host.appendChild(fig);
        if (run.rush) continue;
        run.active = k;
        revealFigure(fig, k, step);
        return;                        // the uncovering calls step() when it is done
      }
      if (b.type === "pause") {
        if (run.rush) continue;        // nothing to wait for once it is all shown
        run.active = k;
        run.timer = setTimeout(step, b.ms);
        return;
      }
      const el = document.createElement("div");
      el.className = "stext";
      host.appendChild(el);
      if (run.rush) { el.textContent = b.text; continue; }
      run.active = k;
      typeInto(el, b.text, k, idx === 1 ? 120 : 240, step);
      return;                          // the reveal calls step() when it lands
    }
    run.active = null;
    markSeen(key);
    if (done) done();
  };
  // Cut a pause short, or finish the paragraph being written; either way the
  // rest follows at once because rush is already set.
  run.flush = () => {
    if (run.timer) { clearTimeout(run.timer); run.timer = null; step(); return; }
    const t = typing.get(run.active);
    if (t) t.finish();
  };
  step();
  return run;
}

// Finishing the reveal is there but not advertised: three taps within a
// second and a half on the text that is arriving. One or two taps do nothing,
// so a thumb that brushes the card while reading does not throw the reveal
// away. It finishes the whole card, not just the paragraph running.
const RUSH_TAPS = 3;
const RUSH_WINDOW_MS = 1500;
function attachRush(card, runs) {
  let taps = [];
  card.addEventListener("click", (ev) => {
    if (!ev.target.closest(".stext")) return;
    const now = performance.now();
    taps = taps.filter((t) => now - t < RUSH_WINDOW_MS);
    taps.push(now);
    if (taps.length < RUSH_TAPS) return;
    taps = [];
    for (const run of runs) {
      if (!run.active) continue;
      run.rush = true;
      run.flush();
    }
  });
}

/* ---- the walk ---- */
function stopResult(s) { return STATE.result[s.id] || null; }
function lensUnlocked(s) { return !s.gate || !!STATE.gate[s.id]; }

function renderWalk() {
  stopCompass();
  const n = HUNT.stops.length;
  const done = Math.min(STATE.current, n);
  $("progressfill").style.width = (100 * done / n) + "%";
  paintSimBanner();

  const box = $("walk");
  box.innerHTML = "";
  for (let i = 0; i < done; i++) box.appendChild(doneCard(i));
  box.appendChild(done === n ? outroCard() : openCard(done));
  focusCurrent();
}

// How a finished stop went, for the word in its header.
function statusOf(s) {
  const res = stopResult(s);
  const parts = Object.keys(skippedParts(s)).filter((p) => p !== "question");
  const word = res === "right" ? "Right" : res === "wrong" ? "Wrong"
             : res === "skipped" ? "Skipped" : "Done";
  const PART = { gate: "check", match: "match" };
  return word + (parts.length ? ` · skipped ${parts.map((p) => PART[p] || p).join(", ")}` : "");
}

// The header of any card: the chapter, and a title only if there is one. No
// numbering anywhere.
function cardHead(s, status) {
  const l = labelOf(s);
  return `<div class="shead"><span class="chap">${escapeHtml(l.chapter)}</span>`
    + (status ? `<span class="pr">${escapeHtml(status)}</span>` : "") + `</div>`
    + (l.title ? `<div class="stitle">${escapeHtml(l.title)}</div>` : "");
}

// A finished stop, rebuilt whole and left on the page above the open one: the
// words and pictures as they were read, the answer that was typed and the
// letters it left. None of its controls, since there is nothing left to do.
function doneCard(i) {
  const s = HUNT.stops[i];
  const div = document.createElement("div");
  div.className = "stop done" + (stopResult(s) === "wrong" ? " miss" : "");
  div.dataset.idx = i;
  div.innerHTML = cardHead(s, statusOf(s));
  runBlocks(div, s.body, "body:" + s.id, null, true);
  if (s.question) div.appendChild(verdictLine(s));
  if (s.letters) div.appendChild(lettersBox(s, false));
  const after = s.after || [];
  if (after.length) {
    div.appendChild(payRule());
    runBlocks(div, after, "after:" + s.id, null, true);
  }
  return div;
}
function payRule() {
  const rule = document.createElement("div");
  rule.className = "payrule";
  return rule;
}

// The open stop. Each part is appended by the part before it finishing, so the
// card grows downwards at reading speed rather than arriving all at once.
function openCard(i) {
  const s = HUNT.stops[i];
  const div = document.createElement("div");
  div.className = "stop open";
  div.dataset.idx = i;
  div.innerHTML = cardHead(s, "");

  const runs = [];
  attachRush(div, runs);
  // live: the stop is being read for the first time, rather than a card
  // rebuilt after a tap or a reload. Reduced motion skips the reveal but not
  // the arrival, so the lens still opens on it.
  const live = !seenSet().has("body:" + s.id);
  runs.push(runBlocks(div, s.body, "body:" + s.id, () => afterBody(div, i, runs, live)));
  return div;
}

// A match lens is a step in the stop, not a tool beside it: it opens by itself
// and the stop waits until Progress is tapped inside it.
function matchPending(s) {
  return !!(s.lens && s.lens.kind === "stencil" && s.lens.match && !STATE.matched[s.id]);
}
function autoLens(s) {
  return !!(s.lens && s.lens.kind === "stencil" && s.lens.auto && matchPending(s));
}

function afterBody(card, i, runs, live) {
  const s = HUNT.stops[i];
  if (s.gate && !STATE.gate[s.id]) { card.appendChild(gateSection(i, card)); return; }
  // Passed but not yet continued: the gate's Continue button is the tap the
  // haptic lives on, and for an auto lens it is also the gesture the camera
  // is asked for inside. Nothing below it appears until it is tapped.
  if (s.gate && !STATE.cont[s.id]) { card.appendChild(gateDone(i)); return; }
  if (s.gate) card.appendChild(gateDone(i));
  afterGate(card, i, runs);
}

function afterGate(card, i, runs) {
  const s = HUNT.stops[i];
  // The camera always opens from a tap: iOS refuses it otherwise, and the fix
  // window and a reveal timer are not taps. So an auto lens never opens by
  // itself. At the moment it would have, a lit button opens it; after a gate
  // that button is Continue, which opens the lens directly; with no gate it
  // is this one, lit when the body finishes, a triple tap included.
  if (matchPending(s)) {
    const row = document.createElement("div");
    row.className = "camrow";
    const btn = document.createElement("button");
    btn.className = "btn primary";
    btn.textContent = "Open the camera";
    btn.setAttribute("data-strong", "");
    btn.onclick = () => openLens(s);
    row.appendChild(btn);
    card.appendChild(row);
    return;
  }
  if (s.lens) card.appendChild(lensRow(s));
  if (s.question && !stopResult(s)) { card.appendChild(questionSection(i)); return; }
  if (s.question) card.appendChild(verdictLine(s));
  afterResolved(card, i, runs);
}

function afterResolved(card, i, runs) {
  const s = HUNT.stops[i];
  if (!stopResult(s)) { STATE.result[s.id] = "done"; saveState(); }
  if (s.letters) {
    // The tiles arrive one by one the first time the finish is seen, and are
    // simply there on every rebuild after that.
    const key = "letters:" + s.id;
    const first = !seenSet().has(key);
    card.appendChild(lettersBox(s, first && !REDUCED));
    if (first) markSeen(key);
  }
  const blocks = s.after || [];
  const finish = () => card.appendChild(nextRow(i));
  if (!blocks.length) { finish(); return; }
  card.appendChild(payRule());
  runs.push(runBlocks(card, blocks, "after:" + s.id, finish));
}

/* ---- the letters a stop leaves behind ----
   Tiles on the card once the stop is finished, however it was finished. In
   the content's order, or scrambled by a fixed shuffle of the stop's name, so
   every phone on the team shows the same order and none shows the true one.
   The true order is what the ending puts back together. */
function lettersOf(s) {
  const text = s.letters.text.replace(/\s+/g, "").toUpperCase().split("");
  return s.letters.scrambled && text.length > 1 ? shuffled(text, s.id) : text;
}
function shuffled(arr, seed) {
  let h = 2166136261;
  for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const rnd = () => {
    h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0;
    return h / 4294967296;
  };
  const out = arr.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  if (out.join("") === arr.join("")) out.push(out.shift());
  return out;
}
function lettersBox(s, live) {
  const box = document.createElement("div");
  box.className = "letters" + (live ? " live" : "");
  lettersOf(s).forEach((ch, n) => {
    const tile = document.createElement("span");
    tile.className = "tile";
    tile.textContent = ch;
    if (live) tile.style.animationDelay = (n * 110) + "ms";
    box.appendChild(tile);
  });
  return box;
}

function nextRow(i) {
  const row = document.createElement("div");
  row.className = "srow";
  const btn = document.createElement("button");
  btn.className = "btn primary";
  // The ending is the next thing after the last stop, and Finish says so.
  btn.textContent = i === HUNT.stops.length - 1 ? "Finish" : "Next";
  btn.setAttribute("data-strong", "");
  btn.onclick = () => {
    STATE.current = Math.max(STATE.current, i + 1);
    saveState();
    renderWalk();
  };
  row.appendChild(btn);
  return row;
}

function lensRow(s) {
  const row = document.createElement("div");
  row.className = "lensrow";
  const b = document.createElement("button");
  b.className = "lensbtn";
  b.textContent = "Lens";
  b.onclick = () => openLens(s);
  row.appendChild(b);
  return row;
}
function openLens(s) {
  if (!window.Lens) { toast("The lens did not load."); return; }
  window.Lens.open(s.lens, HUNT.diary_mm || { w: 148, h: 210 }, {
    stopId: s.id,
    getAccuracy: () => (lastFix && lastFix.accuracy != null ? lastFix.accuracy : null),
    logLine,
    // Progress was tapped: the lens has closed and ticked, the stop goes on.
    // A name that comes with the finish comes here, gate or no gate.
    onProgress: () => {
      STATE.matched[s.id] = true;
      if (revealsOnFinish(s)) reveal(s);
      saveState();
      renderWalk();
    },
    testMode: !!HUNT.test_mode,
    onSkip: () => {
      STATE.matched[s.id] = true;
      markSkipped(s, "match");
      saveState();
      renderWalk();
    },
    // The threshold slider's setting, kept per stop while test mode is on so
    // the owner can walk about with it. Off test mode, the content's own.
    threshold: HUNT.test_mode ? LS.get("thr." + s.id, null) : null,
    onThreshold: (v) => { if (HUNT.test_mode) LS.set("thr." + s.id, v); },
  });
}

// "You're here." and, until it is tapped, a Continue button. The gate passed
// asynchronously so it could not tick; the tap can. It is enabled only once
// the gate has passed, so it is not a skip.
function gateDone(i) {
  const s = HUNT.stops[i];
  const d = document.createElement("div");
  d.className = "gatedone";
  d.textContent = "You're here.";
  if (STATE.cont[s.id]) return d;
  const btn = document.createElement("button");
  btn.className = "btn primary";
  btn.textContent = "Continue";
  btn.setAttribute("data-strong", "");
  btn.onclick = () => {
    STATE.cont[s.id] = true;
    saveState();
    renderWalk();
    if (autoLens(s)) openLens(s);
  };
  d.appendChild(btn);
  return d;
}

/* ---- the gate ---- */
function gateSection(i, card) {
  const s = HUNT.stops[i];
  const wrap = document.createElement("div");
  wrap.className = "gatewrap";
  // Only the compass, the distance and the button. No prompt: a gate.prompt
  // in older content is carried through unshown. No privacy note either.
  wrap.innerHTML =
    `<button class="btn primary gatebtn">Check location</button>
     <div class="gatestat" role="status" aria-live="polite"></div>`;
  const btn = wrap.querySelector(".gatebtn");
  const stat = wrap.querySelector(".gatestat");

  const els = { compass: null, distance: null, card };
  if (s.compass) {
    els.compass = document.createElement("div");
    els.compass.className = "compass";
    els.compass.hidden = true;
    els.compass.innerHTML = `<span class="cl">Bearing</span><span class="pt"></span>`;
    wrap.appendChild(els.compass);
  }
  if (s.distance) {
    els.distance = document.createElement("div");
    els.distance.className = "distance";
    els.distance.hidden = true;
    wrap.appendChild(els.distance);
  }
  const watched = s.compass || s.distance || s.reveal;
  if (watched) startFixWatch(s, els);

  if (HUNT.test_mode) {
    // Skipping a gate is not passing it, so it does not tick. It does count as
    // having continued, because there is nothing to continue from.
    wrap.appendChild(skipButton("Skip this location check", () => {
      STATE.gate[s.id] = true;
      STATE.cont[s.id] = true;
      markSkipped(s, "gate");
      saveState();
      renderWalk();
      if (autoLens(s)) openLens(s);
    }));
  }

  btn.onclick = () => checkin(i, btn, stat, watched ? els : null);
  return wrap;
}

// Rounded the way a person would say it: to the nearest hundred metres over
// a kilometre, fifty from five hundred, ten under that.
function aboutM(d) {
  if (d >= 1000) return `About ${(Math.round(d / 100) / 10).toFixed(1)} km`;
  if (d >= 500) return `About ${Math.round(d / 50) * 50} m`;
  return `About ${Math.max(10, Math.round(d / 10) * 10)} m`;
}

// One watch feeds three things while the gate card is open. The bearing only
// on a fix good enough to mean anything, and only from far enough away that
// it is a direction rather than a finder: under COMPASS_MIN_M it shows
// nothing, not "close", nothing, unless the stop asks for it all the way in
// with compass_min_m of zero. The distance from every usable fix, all the way
// in. And the name, once, when a usable fix reads under reveal.at_m.
function startFixWatch(s, els) {
  const minM = s.compass_min_m == null ? COMPASS_MIN_M : s.compass_min_m;
  const paint = (lat, lon, acc) => {
    const usable = (acc || 0) <= ACC_USELESS_M;
    const d = haversineM(lat, lon, s.gate.lat, s.gate.lon);
    if (els.compass) {
      if (!usable || d <= minM) { els.compass.hidden = true; }
      else {
        els.compass.querySelector(".pt").textContent =
          compassPoint(lat, lon, s.gate.lat, s.gate.lon);
        els.compass.hidden = false;
      }
    }
    if (els.distance) {
      if (!usable) { els.distance.hidden = true; }
      else { els.distance.textContent = aboutM(d); els.distance.hidden = false; }
    }
    // at_m of zero means on the pass, never from a fix.
    if (s.reveal && s.reveal.at_m > 0 && usable && d <= s.reveal.at_m) reveal(s, els.card);
  };
  if (SIM) { paint(SIM.lat, SIM.lon, SIM.acc); return; }
  if (!navigator.geolocation) return;
  compassWatch = navigator.geolocation.watchPosition(
    (pos) => {
      lastFix = pos.coords;
      paint(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
    },
    () => { if (els.compass) els.compass.hidden = true; if (els.distance) els.distance.hidden = true; },
    { enableHighAccuracy: true, maximumAge: 5000 });
}
// A watch left running is a phone battery spent on a stop nobody is looking at,
// on a walk that still has to get everybody home.
function stopCompass() {
  if (compassWatch !== null && navigator.geolocation) {
    navigator.geolocation.clearWatch(compassWatch);
  }
  compassWatch = null;
}

function getFix() {
  if (SIM) {
    return Promise.resolve({ latitude: SIM.lat, longitude: SIM.lon, accuracy: SIM.acc });
  }
  // Phones hand over a coarse network fix first and a good satellite fix a few
  // seconds later. Taking the first one and subtracting its large error is how
  // a gate opens from the next street, so watch for a few seconds and keep the
  // best reading rather than the first. maximumAge is 0 because a cached fix
  // from twenty seconds ago is twenty-five metres of walking out of date.
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error("nogeo")); return; }
    let best = null, done = false, id = null;
    const finish = () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      if (id !== null) navigator.geolocation.clearWatch(id);
      if (best) resolve(best); else reject(new Error("nofix"));
    };
    const timer = setTimeout(finish, FIX_WINDOW_MS);
    id = navigator.geolocation.watchPosition(
      (pos) => {
        if (!best || pos.coords.accuracy < best.accuracy) best = pos.coords;
        if (best.accuracy <= FIX_GOOD_ENOUGH_M) finish();
      },
      // Without the clearWatch, a refused or failed fix left a high-accuracy
      // watch running for the rest of the afternoon, on a phone somebody still
      // needs at the end of it.
      (err) => {
        if (best) return;
        done = true;
        clearTimeout(timer);
        if (id !== null) navigator.geolocation.clearWatch(id);
        reject(err);
      },
      { enableHighAccuracy: true, timeout: FIX_WINDOW_MS, maximumAge: 0 });
  });
}

function metresAway(d) {
  return d >= 1000 ? `About ${(d / 1000).toFixed(1)} kilometres away.`
                   : `About ${Math.max(10, Math.round(d / 10) * 10)} metres away.`;
}

async function checkin(i, btn, stat, els) {
  const s = HUNT.stops[i];
  btn.disabled = true;
  stat.textContent = "Finding you…";
  // One position watch at a time. The compass is already listening, and a
  // second concurrent high-accuracy watch is two goes at the same radio for
  // one answer; on some browsers it is worse than wasteful, because the second
  // watch is simply never called back and the check times out with no fix at
  // all. Hand the radio over for the length of the check and take it back after.
  stopCompass();
  const rearm = () => {
    btn.disabled = false;
    if (els) startFixWatch(s, els);
  };
  let c;
  try {
    c = await getFix();
    lastFix = c;
  } catch (err) {
    stat.textContent = err && err.code === 1
      ? "Location is blocked for this site. Allow it in your browser settings."
      : "No usable fix. Step into the open and try again.";
    rearm();
    return;
  }
  const d = haversineM(c.latitude, c.longitude, s.gate.lat, s.gate.lon);
  // The check's own fix is a fix like any other for the name.
  if (s.reveal && s.reveal.at_m > 0 && (c.accuracy || 0) <= ACC_USELESS_M && d <= s.reveal.at_m) reveal(s);
  if (gatePasses(d, c.accuracy, s.gate.radius_m)) {
    // A pass names the place whatever the fixes said, unless the name is
    // waiting for a match or a question further down the card.
    if (!revealsOnFinish(s) || completesOn(s) === "gate") reveal(s);
    STATE.gate[s.id] = true;
    saveState();
    stat.textContent = "You're here.";
    renderWalk();
    return;
  }
  // A vague fix is not a near miss, it is no information, and saying a distance
  // about it would be a lie. Say that it is unusable and nothing else.
  stat.textContent = (c.accuracy || 0) > ACC_USELESS_M
    ? "No usable fix. Step into the open and try again."
    : metresAway(d);
  rearm();
}

/* ---- the question ---- */
function questionSection(i) {
  const s = HUNT.stops[i];
  const q = s.question;
  const limit = q.guesses || 3;
  const wrap = document.createElement("div");
  wrap.innerHTML =
    `<div class="qask">${escapeHtml(q.ask)}</div>
     <div class="qrow">
       <input type="text" maxlength="60" enterkeyhint="send" autocapitalize="off"
              autocorrect="off" spellcheck="false" autocomplete="off"
              placeholder="your answer" aria-label="Your answer">
       <button class="btn primary">Check</button>
     </div>
     <div class="qmeter meter">
       <span class="mlabel">Guesses</span>
       <div class="mbar"><div class="mfill bad"></div></div>
       <span class="mnum"></span>
     </div>`;

  const inp = wrap.querySelector("input");
  const fill = wrap.querySelector(".mfill");
  const num = wrap.querySelector(".mnum");
  const paint = () => {
    const used = Math.min(STATE.used[s.id] || 0, limit);
    fill.style.width = (100 * used / limit) + "%";
    num.textContent = `${limit - used} left`;
  };
  paint();

  const submit = (viaKey) => {
    const said = inp.value.trim();
    if (!said) { toast("Type something first."); return; }
    // What was typed stays on the card after the box has gone, right or not.
    STATE.answer[s.id] = said;
    if (answerAccepted(said, q.answers)) {
      // A right answer is a progress moment: the strong pattern, synchronously,
      // before anything. On the Check button it replaces the single pulse
      // the tap already started; from the keyboard it is the only tick.
      haptic(true);
      STATE.result[s.id] = "right";
      if (revealsOnFinish(s) && completesOn(s) === "question") reveal(s);
      saveState();
      renderWalk();
      return;
    }
    // Read the count back out of the state, not off the closure. The card is
    // not re-rendered on a wrong answer, so a closure copy stayed at zero and
    // the second wrong answer kept writing one.
    const used = (STATE.used[s.id] || 0) + 1;
    STATE.used[s.id] = used;
    if (used >= limit) {
      STATE.result[s.id] = "wrong";
      // Out of guesses is still the finish of the stop, and the name comes.
      if (revealsOnFinish(s) && completesOn(s) === "question") reveal(s);
    }
    saveState();
    if (used >= limit) { renderWalk(); return; }
    const card = wrap.closest(".stop");
    void card.offsetWidth;
    card.classList.add("wrong");
    setTimeout(() => card.classList.remove("wrong"), 400);
    paint();
    inp.select();
  };
  wrap.querySelector(".btn").onclick = () => submit(false);
  inp.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); submit(true); }
  });
  if (HUNT.test_mode) {
    wrap.appendChild(skipButton("Skip this question", () => {
      STATE.result[s.id] = "skipped";
      markSkipped(s, "question");
      saveState();
      renderWalk();
    }));
  }
  return wrap;
}

// A resolved question keeps its ask on the card, and what was typed, so the
// pay-off underneath is read against the thing that was asked rather than
// on its own.
function verdictLine(s) {
  const wrap = document.createElement("div");
  const res = stopResult(s);
  // Prefer a spelled-out answer over a digit when both are accepted: "three" is
  // what the diary says, and "3" would read as a score.
  const shown = s.question.answers.find((x) => /[a-z]/i.test(x)) || s.question.answers[0];
  const verdict = res === "right" ? "Yes."
                : res === "skipped" ? "Skipped."
                : `Marked wrong. The answer was ${escapeHtml(shown)}.`;
  const said = STATE.answer[s.id];
  wrap.innerHTML =
    `<div class="qask">${escapeHtml(s.question.ask)}</div>`
    + (said ? `<div class="qsaid">${escapeHtml(said)}</div>` : "")
    + `<div class="qverdict ${res === "right" ? "yes" : res === "skipped" ? "" : "no"}">${verdict}</div>`;
  return wrap;
}

/* ---- the ending ----
   Below the finished stops, which stay where they are. First the letters
   every stop left behind, on one line in the stops' order, arriving one at
   a time; then, after a held moment, each slides to its place in the finale
   and the line reads what it was always going to read. Then the outro, and
   in test mode the tally. */
const FINALE_LETTER_MS = 150;       // between letters arriving on the line
const FINALE_HOLD_MS = 1200;        // the jumbled line held before it moves
const FINALE_SLIDE_MS = 1700;       // the slide, matching the CSS transition
function outroCard() {
  const div = document.createElement("div");
  div.className = "stop open end";
  div.dataset.idx = "end";
  const runs = [];
  attachRush(div, runs);
  const rest = () => {
    runs.push(runBlocks(div, HUNT.outro || [], "outro", () => {
      if (HUNT.test_mode) div.appendChild(tally());
    }));
  };
  if (HUNT.finale) finale(div, rest); else rest();
  return div;
}

function finale(host, done) {
  const letters = HUNT.stops.filter((s) => s.letters)
    .flatMap((s) => s.letters.text.replace(/\s+/g, "").toUpperCase().split(""));
  const target = HUNT.finale.toUpperCase().split("");
  const n = Math.max(target.length, letters.length);
  const line = document.createElement("div");
  line.className = "finale";
  line.style.setProperty("--n", n);
  line.setAttribute("aria-label", HUNT.finale);
  host.appendChild(line);

  // Each letter's slot in the finale: the first unused letter of the same
  // kind, left to right. The build has already checked they all have one.
  const used = new Set();
  const slot = letters.map(() => null);
  target.forEach((ch, at) => {
    if (ch === " ") return;
    const k = letters.findIndex((c, i) => c === ch && !used.has(i));
    if (k >= 0) { used.add(k); slot[k] = at; }
  });
  const spans = letters.map((ch, k) => {
    const sp = document.createElement("span");
    sp.className = "fl";
    sp.textContent = ch;
    sp.style.left = (100 * k / n) + "%";
    line.appendChild(sp);
    return sp;
  });
  const place = (sp, k) => { sp.style.left = (100 * (slot[k] == null ? k : slot[k]) / n) + "%"; };
  const settled = () => {
    spans.forEach((sp, k) => { place(sp, k); sp.classList.add("on"); sp.classList.remove("moving"); });
    line.classList.add("resolved");
  };
  if (seenSet().has("finale") || REDUCED) { settled(); done(); return; }

  let k = 0;
  const arrive = () => {
    if (k < spans.length) { spans[k].classList.add("on"); k += 1; setTimeout(arrive, FINALE_LETTER_MS); return; }
    setTimeout(slide, FINALE_HOLD_MS);
  };
  const slide = () => {
    spans.forEach((sp) => sp.classList.add("moving"));
    requestAnimationFrame(() => spans.forEach(place));
    setTimeout(() => {
      spans.forEach((sp) => sp.classList.remove("moving"));
      line.classList.add("resolved");
    }, FINALE_SLIDE_MS);
    setTimeout(() => { markSeen("finale"); done(); }, FINALE_SLIDE_MS + 700);
  };
  setTimeout(arrive, 500);
}

// Right and wrong are questions. Skipped is parts: a gate, a match or a
// question that was stepped round rather than done, named per stop, and
// never counted as wrong.
function tally() {
  const asked = HUNT.stops.filter((s) => s.question);
  const right = asked.filter((s) => STATE.result[s.id] === "right");
  const wrong = asked.filter((s) => STATE.result[s.id] === "wrong");
  const PART = { gate: "location check", match: "match", question: "question" };
  const skipped = HUNT.stops
    .map((s) => ({ s, parts: Object.keys(skippedParts(s)).filter((p) => PART[p]) }))
    .filter((x) => x.parts.length);
  const nSkipped = skipped.reduce((n, x) => n + x.parts.length, 0);
  const el = document.createElement("div");
  el.className = "tally";
  const item = (s) => `<li>${escapeHtml(labelOf(s).name)}</li>`;
  el.innerHTML = `${right.length} right, ${wrong.length} wrong`
    + (nSkipped ? `, ${nSkipped} skipped.` : ".")
    + (wrong.length ? `<div>Wrong:</div><ul>${wrong.map(item).join("")}</ul>` : "")
    + (nSkipped
        ? `<div>Skipped:</div><ul>${skipped.map((x) =>
            `<li>${escapeHtml(labelOf(x.s).name)} (${x.parts.map((p) => PART[p]).join(", ")})</li>`)
            .join("")}</ul>`
        : "");
  return el;
}

/* ---- the menu ---- */
function openMenu() {
  const n = LS.get("log", []).length;
  $("modalcard").innerHTML = `<h2>Menu</h2>
    <div class="sub">Progress lives on this phone and nowhere else.</div>
    <div class="btnrow"><button class="btn ghost" id="mclose">Close</button>
      <button class="btn primary" id="mrestart">Start over</button></div>
    <div class="btnrow"><button class="btn ghost" id="mcopylog"${n ? "" : " disabled"}>
      Copy log${n ? ` (${n} line${n === 1 ? "" : "s"})` : ""}</button>${HUNT.test_mode
      ? `<button class="btn ghost" id="mtick">Test the tick</button>` : ""}</div>
    <div id="tickinfo" class="tickinfo" hidden></div>
    <div id="loghost"></div>
    <div id="simhost"></div>`;
  $("modal").classList.add("show");
  $("mclose").onclick = closeModal;
  $("mrestart").onclick = confirmRestart;
  $("mcopylog").onclick = copyLog;
  // Test mode only: the tap itself is the tick, like every tap, and this
  // shows what the phone did with it, so a silent phone says why.
  if ($("mtick")) $("mtick").onclick = () => {
    $("tickinfo").textContent = hapticReport(lastTick || { vibrate: "none" });
    $("tickinfo").hidden = false;
  };
  if (TESTING) $("simhost").appendChild(simControls());
}

// The whole log onto the clipboard as plain text. Where the clipboard is
// refused, the text is shown selected instead, which is the same thing with
// one more tap.
async function copyLog() {
  const text = logText();
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    toast("Log copied.");
    return;
  } catch (err) { /* fall through to the box */ }
  const host = $("loghost");
  host.innerHTML = "";
  const box = document.createElement("textarea");
  box.className = "logbox";
  box.readOnly = true;
  box.value = text;
  host.appendChild(box);
  box.focus(); box.select();
  toast("Could not reach the clipboard. Copy it from the box.");
}

// Reached from the menu, and from the bar button while skips are on. Always
// through the confirm: a thumb on a phone in the rain is not a decision.
function confirmRestart() {
  $("modalcard").innerHTML = `<h2>Start over?</h2>
    <div class="sub">This forgets how far you have walked and every answer given.
    Nothing else is kept, and it cannot be undone.</div>
    <div class="btnrow">
      <button class="btn ghost" id="sono">Keep going</button>
      <button class="btn primary" id="soyes">Start over</button>
    </div>`;
  $("modal").classList.add("show");
  $("sono").onclick = closeModal;
  $("soyes").onclick = () => {
    LS.del("state"); LS.del("sim"); LS.del("started");
    STATE = freshState(); SIM = null; lastFocused = null;
    closeModal();
    $("s-walk").classList.remove("on");
    $("s-intro").classList.add("on");
    renderIntro();
    window.scrollTo(0, 0);
  };
}

/* ---- the approach simulator ----
   A way to exercise the gates without being in the park. It simulates WALKING,
   not arriving. There is no control that places you at a stop and no control
   that opens one. You start half a kilometre out and press a button that moves
   you a hundred and twenty metres closer, and the stop opens when the ordinary
   check says you are inside the radius.

   The earlier version had a "stand at stop 7" list. It fed a real position into
   a real check, so the pass rule stayed honest, but one tap opened any gated
   stop, and a control that opens a gated stop is a skip button whatever the
   label says. It is gone.

   It is also deliberately loud. A banner stays up the whole time a made-up
   position is in use, because a quiet override eventually gets mistaken for a
   working gate. */
function currentGatedStop() {
  const s = HUNT.stops[Math.min(STATE.current, HUNT.stops.length - 1)];
  return s && s.gate ? s : null;
}
function simControls() {
  const s = currentGatedStop();
  const dev = document.createElement("div");
  dev.className = "devrow";
  if (!s) {
    dev.innerHTML = `<span class="devlabel">Testing</span>
      <div class="devnote">The stop you are on has no gate, so there is nothing
      to walk towards. Open a gated stop and come back.</div>`;
    return dev;
  }
  const away = SIM ? `${Math.round(haversineM(SIM.lat, SIM.lon, s.gate.lat, s.gate.lon))} m away`
                   : "not simulating";
  const acc = SIM ? SIM.acc : 20;
  dev.innerHTML =
    `<span class="devlabel">Testing · ${escapeHtml(labelOf(s).name)}</span>
     <button data-act="start">Start ${SIM_START_M} m away</button>
     <button data-act="step"${SIM ? "" : " disabled"}>Walk ${SIM_STEP_M} m closer</button>
     <button data-act="jump">Jump to ${SIM_JUMP_M} m out</button>
     <span class="devdist">${away}</span>
     <button data-act="acc" aria-pressed="${acc > ACC_USELESS_M}">Fix ${acc} m</button>
     <button data-act="off"${SIM ? "" : " disabled"}>Back to the real GPS</button>
     <div class="devnote">These move a made-up position through the real check.
     Nothing here opens the stop: even the jump only stands you inside the
     radius, and the check is still the check. The jump is there so a name that
     resolves on the pass, with no fix ever read on the way in, can be seen.
     The fix button swaps a good 20 m reading for a useless 100 m one.</div>`;
  dev.querySelector('[data-act="start"]').onclick = () => { simStart(s); openMenu(); };
  dev.querySelector('[data-act="step"]').onclick = () => { simStep(s); openMenu(); };
  dev.querySelector('[data-act="jump"]').onclick = () => { simJump(s); openMenu(); };
  dev.querySelector('[data-act="acc"]').onclick = () => {
    const next = acc > ACC_USELESS_M ? 20 : 100;
    if (SIM) setSim({ ...SIM, acc: next });
    else { simStart(s, next); }
    openMenu();
  };
  dev.querySelector('[data-act="off"]').onclick = () => {
    setSim(null); closeModal(); toast("Back to the real GPS.");
  };
  return dev;
}
function paintSimBanner() {
  const b = $("simbanner");
  if (!SIM) { b.hidden = true; return; }
  b.hidden = false;
  b.textContent = `Testing. Standing at a made-up position about `
                + `${Math.round(SIM.dist)} m out, with a claimed accuracy of `
                + `${SIM.acc} m. The gate rule is the real one and is not being bypassed.`;
}
function setSim(sim) {
  SIM = sim;
  if (sim) LS.set("sim", sim); else LS.del("sim");
  renderWalk();
}
// Start the approach: drop the walker SIM_START_M short of the stop, due south,
// there being no previous stop to come in from.
function simStart(s, acc) {
  const p = destPoint(s.gate.lat, s.gate.lon, 180, SIM_START_M);
  setSim({ lat: p.lat, lon: p.lon, acc: acc || 20, dist: SIM_START_M });
}
// Straight to SIM_JUMP_M short of the stop, with no positions in between. A
// phone that lost the sky on the way in and found it again at the door reads
// the same, and the name has to resolve on the pass when that happens.
function simJump(s) {
  const p = destPoint(s.gate.lat, s.gate.lon, 180, SIM_JUMP_M);
  setSim({ lat: p.lat, lon: p.lon, acc: SIM ? SIM.acc : 20, dist: SIM_JUMP_M });
}
// One press, one step closer. It cannot overshoot onto the stop itself: the
// last stride stops short, so the gate is always what lets you in.
function simStep(s) {
  if (!SIM) return;
  const d = haversineM(SIM.lat, SIM.lon, s.gate.lat, s.gate.lon);
  const step = Math.min(SIM_STEP_M, Math.max(0, d - 5));
  if (step <= 0) { toast("That is as close as this will take you."); return; }
  const b = bearingDeg(SIM.lat, SIM.lon, s.gate.lat, s.gate.lon);
  const p = destPoint(SIM.lat, SIM.lon, b, step);
  setSim({ lat: p.lat, lon: p.lon, acc: SIM.acc,
           dist: haversineM(p.lat, p.lon, s.gate.lat, s.gate.lon) });
}

/* ---- scrolling ---- */
let lastFocused = null;
function focusCurrent() {
  const card = $("walk").lastElementChild;
  if (!card) return;
  const key = card.dataset.idx;
  if (key === lastFocused) return;             // never fight somebody's own scroll
  lastFocused = key;
  requestAnimationFrame(() => {
    const top = card.getBoundingClientRect().top + window.scrollY
              - ($("topbar").offsetHeight + 10);
    window.scrollTo({ top: Math.max(0, top), behavior: REDUCED ? "auto" : "smooth" });
  });
}

/* ---- wiring ---- */
armTicks(document.body);          // the buttons that were here before the observer
$("menubtn").onclick = openMenu;
$("restartbtn").onclick = confirmRestart;
$("restartbtn").hidden = !(HUNT && HUNT.test_mode);
$("modal").onclick = (ev) => { if (ev.target === $("modal")) closeModal(); };
// Changing only the hash does not re-run this script, so the flag would appear
// to do nothing. Reload so it is read again.
window.addEventListener("hashchange", () => {
  if ((location.hash === "#testing") !== TESTING) location.reload();
});

// Every picture in the hunt, fetched while there is still a wifi network and a
// person standing still. After this screen the walk is outdoors, on one bar of
// signal, and an image that has not arrived is a stop that cannot be read.
function preloadImages() {
  const srcs = new Set();
  const walk = (blocks) => (blocks || []).forEach((b) => {
    if (b.type === "image" && b.src) srcs.add(b.src);
  });
  walk(HUNT.intro); walk(HUNT.outro);
  for (const s of HUNT.stops) {
    walk(s.body); walk(s.after);
    if (s.lens && s.lens.kind === "stencil" && s.lens.src) srcs.add(s.lens.src);
  }
  for (const src of srcs) { const im = new Image(); im.src = src; }
}

function beginWalk() {
  LS.set("started", true);
  $("s-intro").classList.remove("on");
  $("s-walk").classList.add("on");
  renderWalk();
}

// The opening: the intro blocks, revealed word by word like everything else,
// and one button.
function renderIntro() {
  const host = $("introbody");
  host.innerHTML = "";
  const runs = [];
  attachRush(host, runs);
  runs.push(runBlocks(host, HUNT.intro || [], "intro", null));
}

(() => {
  if (!HUNT) {
    $("introbody").textContent = "No hunt was baked into this page.";
    $("startbtn").disabled = true;
    return;
  }
  document.title = HUNT.title;
  preloadImages();

  STATE = LS.get("state", null);
  if (!STATE || typeof STATE.current !== "number") STATE = freshState();
  // A walk saved by an earlier build predates some of these. Fill them in
  // rather than start the phone over.
  for (const k of ["gate", "cont", "matched", "result", "used", "skipped", "revealed", "answer"]) {
    STATE[k] = STATE[k] || {};
  }
  STATE.seen = STATE.seen || [];
  // A made-up position must never outlive testing mode. Without this, somebody
  // who once opened the page with ?testing=1 would carry a working bypass in
  // local storage into a real walk, and the gates would be quietly off.
  if (TESTING) SIM = LS.get("sim", null);
  else { SIM = null; LS.del("sim"); }

  // Begin ticks like every other tap: the switch under the finger, and the
  // capture-phase vibration, both before this runs.
  $("startbtn").onclick = () => beginWalk();
  if (LS.get("started", false)) beginWalk();
  else renderIntro();
})();
</script>
</body>
</html>
